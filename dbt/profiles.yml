hw4:
  target: dev
  outputs:
    dev:
      type: clickhouse
      host: "{{ env_var('CLICKHOUSE_HOST', 'localhost') }}"
      port: "{{ env_var('CLICKHOUSE_PORT', '8124') | int }}"
      user: "{{ env_var('CLICKHOUSE_USER', 'hw4') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD', 'hw4_local') }}"
      schema: "{{ env_var('CLICKHOUSE_SCHEMA', 'analytics') }}"
      secure: false
      threads: 4
      connect_timeout: 10
      send_receive_timeout: 300
