name: hw4
version: 1.0.0
config-version: 2
profile: hw4
require-dbt-version: [">=1.10.5", "<1.11.0"]
model-paths: [models]
macro-paths: [macros]
test-paths: [tests]
seed-paths: [seeds]
clean-targets: [target, dbt_packages, logs]
vars:
  "dbt_date:time_zone": UTC
  medium_amount: 100
  large_amount: 1000
  medium_risk_rate: 1
  high_risk_rate: 5
  merchant_min_transactions: 100
dispatch:
  - macro_namespace: dbt_date
    search_order: [hw4, dbt_date]
models:
  hw4:
    staging:
      +materialized: view
    marts:
      +materialized: table
      +engine: MergeTree()
      +order_by: tuple()
seeds:
  hw4:
    states:
      +column_types:
        state_code: String
        state_name: String
