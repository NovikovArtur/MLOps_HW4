- name: daily_state_grain_and_large_share
  model: mart_daily_state_metrics
  given:
  - input: ref('stg_transactions')
    rows:
    - transaction_date: '2024-01-01'
      state_code: CA
      amount: 100
      amount_bucket: MEDIUM
    - transaction_date: '2024-01-01'
      state_code: CA
      amount: 1000
      amount_bucket: LARGE
    - transaction_date: '2024-01-02'
      state_code: CA
      amount: 10
      amount_bucket: SMALL
  expect:
    rows:
    - transaction_date: '2024-01-01'
      state_code: CA
      transaction_count: 2
      total_amount: 1100
      avg_amount: 550
      p95_amount: 1000
      large_transaction_share: 50
    - transaction_date: '2024-01-02'
      state_code: CA
      transaction_count: 1
      total_amount: 10
      avg_amount: 10
      p95_amount: 10
      large_transaction_share: 0
